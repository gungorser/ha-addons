name: Paperless MCP
version: "0.1.0"
slug: paperless_mcp
description: MCP server for Paperless-ngx (baruchiro/paperless-mcp), so Claude can search and tag documents
url: https://github.com/gungorser/ha-addons/tree/master/paperless-mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: MCP endpoint behind the secret path (publish through the reverse proxy, HTTPS only)
options:
  paperless_url: http://ffbb73c4-paperless:8099
schema:
  paperless_url: url
  paperless_token: password
  public_url: url?
  access_key: password?
